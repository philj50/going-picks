      <p class="sub">Toggle AI voices for analysis, lights, and credits. Model is always on.</p>
      <label class="mcfg-row"><span>Cursor</span><input type="checkbox" name="voice_cursor" value="1" checked></label><label class="mcfg-row"><span>NVIDIA</span><input type="checkbox" name="voice_nvidia" value="1" checked></label><label class="mcfg-row"><span>Groq</span><input type="checkbox" name="voice_groq" value="1" checked></label><label class="mcfg-row"><span>Cerebras</span><input type="checkbox" name="voice_cerebras" value="1" checked></label><label class="mcfg-row"><span>Lucy (Ollama)</span><input type="checkbox" name="voice_ollama" value="1" checked></label><label class="mcfg-row"><span>Claude</span><input type="checkbox" name="voice_claude" value="1" ></label><label class="mcfg-row"><span>OpenAI</span><input type="checkbox" name="voice_openai" value="1" ></label>
      <h3 class="msec">Me (paper bets)</h3>
      <label class="mcfg-row"><span>Enable Me</span>
        <input type="checkbox" name="me_enabled" value="1" checked></label>
      <label class="mcfg-row"><span>Bankroll £</span>
        <input name="me_bankroll_gbp" type="number" step="1" value="100.0"></label>
      <label class="mcfg-row"><span>Max stake £/race</span>
        <input name="me_max_stake_gbp" type="number" step="1" value="20.0"></label>
      <label class="mcfg-row"><span>Max daily £</span>
        <input name="me_max_daily_gbp" type="number" step="1" value="30.0"></label>
      <label class="mcfg-row"><span>Live Betfair (off = paper only)</span>
        <input type="checkbox" name="me_live_betfair" value="1" ></label>
      <button class="btn primary" type="submit" style="margin-top:12px;width:100%;padding:12px;
        border-radius:10px;background:var(--brass,#a07d2a);color:#fff;border:0;font-weight:700">Save</button>
    </form></main></body></html>
